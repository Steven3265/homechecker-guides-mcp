version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      mcp-runtime:
        patterns:
          - "@modelcontextprotocol/*"
          - "zod"
      build-tooling:
        patterns:
          - "typescript"
          - "@types/node"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
