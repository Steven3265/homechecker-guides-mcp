# Publish Homechecker Guides to the official MCP Registry.
#
# Trigger from:
# GitHub → Actions → Publish to MCP Registry → Run workflow

name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release before publication
        run: npm run check

      - name: Install pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ARCHIVE}"
          echo "${MCP_PUBLISHER_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar xzf "$ARCHIVE" mcp-publisher
          rm "$ARCHIVE"
          ./mcp-publisher --help >/dev/null

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: |
          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "duplicate version"; then
              echo "This package version is already published in the MCP Registry."
            else
              exit "$EXIT_CODE"
            fi
          fi

      - name: Verify official listing
        run: |
          sleep 5

          RESPONSE=$(curl --fail --silent --show-error \
            "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.Steven3265/homechecker-guides")

          echo "$RESPONSE" | head -c 2000
          echo ""

          echo "$RESPONSE" \
            | grep -F 'io.github.Steven3265/homechecker-guides' \
            >/dev/null

          echo "Homechecker Guides is listed in the official MCP Registry."
