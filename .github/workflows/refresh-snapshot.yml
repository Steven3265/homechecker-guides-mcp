# Refresh the bundled guide snapshot from the public Homechecker export.
#
# Trigger it from the browser: Actions → "Refresh guides snapshot" →
# Run workflow. It fetches https://homechecker.com.au/guides/export.json,
# rebuilds data/guides.json, runs the validator, core tests and retrieval
# benchmark, and opens a pull request only if the content actually changed.
#
# ONE-TIME REPO SETTING: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" must be ticked,
# or the final step cannot open the PR.
#
# The refresh itself uses Node built-ins. Project dependencies are installed so
# the complete TypeScript build and protocol regression suite run before a PR opens.

name: Refresh guides snapshot

on:
  schedule:
    - cron: '17 18 * * *' # daily public-export freshness check
  workflow_dispatch:
    inputs:
      export_url:
        description: 'Guide export URL (leave blank for the live site)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild snapshot from the public export
        run: |
          if [ -n "${{ github.event.inputs.export_url }}" ]; then
            node scripts/snapshot-guides.mjs --url "${{ github.event.inputs.export_url }}"
          else
            node scripts/snapshot-guides.mjs
          fi

      - name: Validate complete repository
        run: |
          npm run check

      - name: Open a pull request if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/guides.json; then
            echo "Snapshot already matches the export — nothing to do."
            exit 0
          fi
          BRANCH="snapshot-refresh-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/guides.json
          git commit -m "Refresh guides snapshot from public export"
          git push origin "$BRANCH"
          gh pr create \
            --title "Refresh guides snapshot" \
            --head "$BRANCH" \
            --body "Regenerated \`data/guides.json\` from the public Homechecker guide export. The complete release validation suite passed in this workflow run. Merging redeploys the connector on Vercel."
