# Refresh the bundled guide snapshot from the public Homechecker export.
#
# Trigger it from the browser: Actions → "Refresh guides snapshot" →
# Run workflow. It fetches https://homechecker.com.au/guides/export.json,
# rebuilds data/guides.json, runs the validator, core tests and retrieval
# benchmark, and opens a pull request only if the content actually changed.
#
# ONE-TIME REPO SETTING: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" must be ticked,
# or the final step cannot open the PR.
#
# The refresh itself uses Node built-ins. Project dependencies are installed so
# the complete TypeScript build and protocol regression suite run before a PR opens.

name: Refresh guides snapshot

on:
  schedule:
    - cron: '17 18 * * *' # daily public-export freshness check
  workflow_dispatch:
    inputs:
      export_url:
        description: 'Guide export URL (leave blank for the live site)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homechecker-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild snapshot from the public export
        env:
          EXPORT_URL: ${{ github.event.inputs.export_url }}
        run: |
          if [ -n "$EXPORT_URL" ]; then
            node scripts/snapshot-guides.mjs --url "$EXPORT_URL"
          else
            node scripts/snapshot-guides.mjs
          fi

      - name: Validate complete repository
        run: |
          npm run check

      - name: Open a pull request if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- data/guides.json; then
            echo "Snapshot already matches the export — nothing to do."
            exit 0
          fi
          BRANCH="automation/guides-snapshot-refresh"
          PR_NUMBER=$(gh pr list --state open --head "$BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number // empty')
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
            if [ -n "$PR_NUMBER" ]; then
              # Each run rebuilds from main; pending content can therefore
              # acquire a new generatedAt without any publication change.
              PENDING_MATCH=$(node scripts/compare-pending-snapshot.mjs "origin/$BRANCH")
              if [ "$PENDING_MATCH" = "equal" ]; then
                echo "The open refresh PR already contains this snapshot content."
                exit 0
              fi
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/guides.json
          git commit -m "Refresh guides snapshot from public export"
          git push --force-with-lease origin "$BRANCH"
          if [ -n "$PR_NUMBER" ]; then
            echo "Updated refresh PR #$PR_NUMBER."
            exit 0
          fi
          gh pr create \
            --base "$BASE_BRANCH" \
            --title "Refresh guides snapshot" \
            --head "$BRANCH" \
            --body "Regenerated \`data/guides.json\` from the public Homechecker guide export. The complete release validation suite passed in this workflow run. Merging redeploys the connector on Vercel."
